<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Copilot: pomocny programista AI (C#)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface-hover: #1c2333;
    --border: #30363d;
    --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15);
    --green: #3fb950;
    --green-glow: rgba(63, 185, 80, 0.12);
    --red: #f85149;
    --red-glow: rgba(248, 81, 73, 0.12);
    --yellow: #d29922;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --code-bg: #0d1117;
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow--blue { background: #58a6ff; top: -200px; right: -100px; }
  .bg-glow--purple { background: #bc8cff; bottom: -200px; left: -100px; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease-out both;
  }

  .header__badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .header__badge svg { flex-shrink: 0; }

  .header__title {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .header__sub {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.5;
  }

  /* ─── PROGRESS BAR ─── */
  .progress {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 17, 23, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
    margin: 0 -24px 36px;
    padding-inline: 24px;
    animation: fadeUp 0.6s 0.1s ease-out both;
  }

  .progress__inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 780px;
    margin: 0 auto;
  }

  .progress__bar {
    flex: 1;
    height: 6px;
    background: var(--surface);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress__fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a371f7);
    border-radius: 100px;
    width: 0%;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .progress__label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 48px;
    text-align: right;
  }

  /* ─── QUESTION CARD ─── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s;
  }
  .question-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .question-card.correct {
    border-color: var(--green);
    box-shadow: 0 0 24px var(--green-glow);
  }
  .question-card.wrong {
    border-color: var(--red);
    box-shadow: 0 0 24px var(--red-glow);
  }

  .question-card__number {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .question-card__text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .question-card__code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 12px 0 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    overflow-x: auto;
    color: var(--text-muted);
    white-space: pre;
  }
  .question-card__code .kw { color: #ff7b72; }
  .question-card__code .fn { color: #d2a8ff; }
  .question-card__code .str { color: #a5d6ff; }
  .question-card__code .cm { color: #8b949e; font-style: italic; }
  .question-card__code .num { color: #79c0ff; }
  .question-card__code .op { color: #ff7b72; }

  .question-card__spacer { height: 12px; }

  /* ─── OPTIONS ─── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .option:hover:not(.disabled) {
    background: var(--surface-hover);
    border-color: var(--accent);
  }

  .option__letter {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .option:hover:not(.disabled) .option__letter {
    border-color: var(--accent);
    color: var(--accent);
  }

  .option__text {
    font-size: 15px;
    line-height: 1.5;
    padding-top: 3px;
    text-align: left;
  }

  .option.selected-correct {
    background: var(--green-glow);
    border-color: var(--green);
  }
  .option.selected-correct .option__letter {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .option.selected-wrong {
    background: var(--red-glow);
    border-color: var(--red);
  }
  .option.selected-wrong .option__letter {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .option.reveal-correct {
    border-color: var(--green);
  }
  .option.reveal-correct .option__letter {
    border-color: var(--green);
    color: var(--green);
  }

  .option.disabled { cursor: default; pointer-events: none; }

  /* ─── EXPLANATION ─── */
  .explanation {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(88, 166, 255, 0.06);
    border-left: 3px solid var(--accent);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    display: none;
  }
  .explanation.show { display: block; animation: fadeUp 0.3s ease-out; }

  /* ─── RESULTS ─── */
  .results {
    text-align: center;
    padding: 48px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: none;
    animation: fadeUp 0.5s ease-out both;
  }
  .results.show { display: block; }

  .results__emoji { font-size: 56px; margin-bottom: 16px; }

  .results__score {
    font-size: 48px;
    font-weight: 800;
    font-family: var(--font-mono);
    background: linear-gradient(135deg, var(--green), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .results__label {
    font-size: 16px;
    color: var(--text-muted);
    margin-top: 4px;
    margin-bottom: 24px;
  }

  .results__message {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: rgba(88, 166, 255, 0.1);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-restart:hover {
    background: rgba(88, 166, 255, 0.2);
    transform: translateY(-1px);
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease-out; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease-out; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .container { padding: 24px 16px 60px; }
    .question-card { padding: 20px; }
    .question-card__text { font-size: 15px; }
    .option { padding: 12px 14px; }
    .progress { margin: 0 -16px 28px; padding-inline: 16px; }
  }

  /* ─── LANGUAGE SWITCHER ─── */
  .lang-switch {
    display: flex; justify-content: center; gap: 4px;
    width: fit-content; margin: 0 auto 28px; padding: 4px;
    border: 1px solid var(--border); border-radius: 100px; background: var(--surface);
    animation: fadeUp 0.6s ease-out both;
  }
  .lang-btn {
    font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 1px;
    min-width: 46px; padding: 6px 12px; border: none; border-radius: 100px;
    background: transparent; color: var(--text-muted); cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn:hover:not(.active) { background: var(--surface-hover); color: var(--text); }
  .lang-btn.active { background: var(--accent); color: var(--bg); cursor: default; }
  .lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* re-render after a language change: no entrance / feedback animations */
  .question-card.no-anim, .question-card.no-anim .explanation.show { transition: none; animation: none; }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow--blue"></div>
<div class="bg-glow bg-glow--purple"></div>

<div class="container">
  <div class="lang-switch" role="group" aria-label="Język / Language / Idioma / Sprache">
    <button type="button" class="lang-btn" data-lang="pl" lang="pl" title="Polski" aria-label="Polski">PL</button>
    <button type="button" class="lang-btn" data-lang="en" lang="en" title="English" aria-label="English">EN</button>
    <button type="button" class="lang-btn" data-lang="es" lang="es" title="Español" aria-label="Español">ES</button>
    <button type="button" class="lang-btn" data-lang="de" lang="de" title="Deutsch" aria-label="Deutsch">DE</button>
  </div>

  <header class="header">
    <div class="header__badge">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 14.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13zM7 4h2v5H7V4zm0 6h2v2H7v-2z" fill="currentColor"/></svg>
      <span id="tBadge">QUIZ POWTÓRZENIOWY · C#</span>
    </div>
    <h1 class="header__title" id="tTitle">Copilot - pomocny programista AI</h1>
    <p class="header__sub" id="tSub">12 pytań z lekcji o GitHub Copilot i grze Memory w C# (raylib)</p>
  </header>

  <div class="progress">
    <div class="progress__inner">
      <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
      <div class="progress__label" id="progressLabel">0 / 12</div>
    </div>
  </div>

  <div id="quizContainer"></div>

  <div class="results" id="results">
    <div class="results__emoji" id="resultsEmoji"></div>
    <div class="results__score" id="resultsScore"></div>
    <div class="results__label" id="tResultsLabel">poprawnych odpowiedzi</div>
    <div class="results__message" id="resultsMsg"></div>
    <button class="btn-restart" onclick="location.reload()">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 019.3-3.95l-1.8.7a.5.5 0 00.18.96H14a.5.5 0 00.5-.5V1.38a.5.5 0 00-.96-.18l-.7 1.8A7 7 0 101 8a.75.75 0 011.5 0z" fill="currentColor"/></svg>
      <span id="tRestart">Zagraj ponownie</span>
    </button>
  </div>
</div>

<script>
"use strict";

// ─── texts for every language; answers and code samples are shared ───
const I18N = {
  "pl": {
    "ui": {
      "title": "Quiz - Copilot: pomocny programista AI (C#)",
      "badge": "QUIZ POWTÓRZENIOWY · C#",

      "sub": "12 pytań z lekcji o GitHub Copilot i grze Memory w C# (raylib)",

      "restart": "Zagraj ponownie",
      "m100": "Perfekcyjny wynik! Copilot byłby dumny.",

    },
    "questions": [
      {

      },
      {
        "q": "Jak zaakceptować sugestię zaproponowaną przez Copilota w VS Code?",
        "options": [
          "Kliknąć prawym przyciskiem myszy i wybrać \"Accept\"",
          "Nacisnąć Enter",
          "Nacisnąć Ctrl+S",

        ],
        "explanation": "Klawisz Tab akceptuje sugestię Copilota. Jeśli chcemy ją odrzucić, naciskamy Esc."
      },
      {
        "q": "Dlaczego w metodzie <code>HandleClick</code> używamy pętli <code>for (int i = ...)</code>, a nie <code>foreach</code>?",
        "options": [
          "Bo potrzebujemy indeksu i, żeby zapisać go w liście selected",
          "Bo foreach nie działa z listami typu List w C#",
          "Bo pętla for jest zawsze szybsza od foreach",
          "Bo tylko w pętli for można użyć instrukcji break"

        "explanation": "W liście selected przechowujemy indeksy kart, a nie same obiekty. Pętla for daje nam zmienną i, którą możemy dodać do selected. Pętla foreach nie udostępnia indeksu."
      },
      {

        "options": [

          "\"matched\""
        ],
        "explanation": "Stan \"matched\" oznacza, że karta została dopasowana do pary. Metoda DrawSingleCard pomija karty z tym stanem (return), więc znikają z planszy."
      },
      {
        "q": "Co sprawdza funkcja <code>Raylib.CheckCollisionPointRec(pos, card.Rect)</code>?",
        "options": [

          "Czy animacja karty dobiegła końca"
        ],
        "explanation": "CheckCollisionPointRec sprawdza, czy podany punkt (Vector2) leży wewnątrz prostokąta Rectangle. Używamy jej do wykrycia, w którą kartę kliknął gracz."
      },
      {
        "q": "Dlaczego w metodzie <code>HandleClick</code> na końcu znajduje się instrukcja <code>break</code>?",
        "options": [

      {

      {

const CORRECT = [0, 3, 0, 3, 0, 3, 0, 3, 0, 3, 0, 3];
const CODE = [null, null, null, null, null, "<span class=\"kw\">for</span> (<span class=\"kw\">int</span> i = <span class=\"num\">0</span>; i &lt; board.Count; i++)\n{\n    <span class=\"fn\">Card</span> card = board[i];\n    <span class=\"kw\">if</span> (Raylib.<span class=\"fn\">CheckCollisionPointRec</span>(pos, card.Rect) &amp;&amp; card.State == <span class=\"str\">\"hidden\"</span>)\n    {\n        card.State = <span class=\"str\">\"revealing\"</span>;\n        selected.<span class=\"fn\">Add</span>(i);\n        <span class=\"kw\">break</span>;\n    }\n}", null, null, null, null, "<span class=\"kw\">static</span> <span class=\"kw\">void</span> <span class=\"fn\">AnimateCard</span>(<span class=\"fn\">Card</span> card, <span class=\"kw\">float</span> dt)\n{\n    <span class=\"kw\">if</span> (card.State == <span class=\"str\">\"revealing\"</span>)\n    {\n        card.Anim -= dt * <span class=\"num\">5</span>;\n        <span class=\"kw\">if</span> (card.Anim &lt;= <span class=\"num\">0</span>)\n        {\n            card.Anim = <span class=\"num\">0</span>;\n            card.State = <span class=\"str\">\"revealed\"</span>;\n        }\n    }\n}", "<span class=\"kw\">if</span> (freezeTimer &gt; <span class=\"num\">0</span>)\n{\n    freezeTimer -= dt;\n    <span class=\"kw\">if</span> (freezeTimer &lt;= <span class=\"num\">0</span>)\n        <span class=\"fn\">CheckPair</span>();\n}"];
const LANGS = ["pl", "en", "es", "de"];
const TOTAL = CORRECT.length;
let lang = "pl";
const T = () => I18N[lang].ui;
const QS = () => I18N[lang].questions;
const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);

let answered = 0;
let score = 0;
const chosen = new Array(TOTAL).fill(null);   // option picked for each question
let resultsShown = false;
const container = document.getElementById("quizContainer");

function renderQuiz(animate) {
  container.innerHTML = "";
  QS().forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `q${idx}`;

    const letters = ["A", "B", "C", "D"];
    const codeBlock = CODE[idx]
      ? `<div class="question-card__code">${CODE[idx]}</div>`
      : `<div class="question-card__spacer"></div>`;

    card.innerHTML = `
      <div class="question-card__number">${fmt(T().qNum, { n: idx + 1, total: TOTAL })}</div>
      <div class="question-card__text">${q.q}</div>
      ${codeBlock}
      <div class="options">
        ${q.options.map((opt, oi) => `
          <div class="option" data-q="${idx}" data-o="${oi}" onclick="selectAnswer(this, ${idx}, ${oi})">
            <div class="option__letter">${letters[oi]}</div>
            <div class="option__text">${opt}</div>
          </div>
        `).join("")}
      </div>
      <div class="explanation" id="expl${idx}">${q.explanation}</div>
    `;

    if (!animate) card.classList.add("no-anim", "visible");
    container.appendChild(card);
    if (animate) setTimeout(() => card.classList.add("visible"), 80 * idx);
    if (chosen[idx] !== null) markAnswer(idx, chosen[idx], false);
  });
}

function markAnswer(qIdx, oIdx, withFx) {
  const card = document.getElementById(`q${qIdx}`);
  const options = card.querySelectorAll(".option");
  options.forEach(o => o.classList.add("disabled"));
  if (oIdx === CORRECT[qIdx]) {
    options[oIdx].classList.add("selected-correct");
    card.classList.add("correct");
    if (withFx) card.classList.add("pop");
  } else {
    options[oIdx].classList.add("selected-wrong");
    card.classList.add("wrong");
    if (withFx) card.classList.add("shake");
    options[CORRECT[qIdx]].classList.add("reveal-correct");
  }
  document.getElementById(`expl${qIdx}`).classList.add("show");
}

function selectAnswer(el, qIdx, oIdx) {
  if (chosen[qIdx] !== null) return;
  chosen[qIdx] = oIdx;
  if (oIdx === CORRECT[qIdx]) score++;
  markAnswer(qIdx, oIdx, true);

  answered++;
  updateProgress();

  if (answered === TOTAL) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = (answered / TOTAL) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${answered} / ${TOTAL}`;
}

function renderResults() {
  const pct = Math.round((score / TOTAL) * 100);
  const ui = T();
  let emoji, msg;
  if (pct === 100) { emoji = "🏆"; msg = ui.m100; }
  else if (pct >= 80) { emoji = "🎉"; msg = ui.m80; }
  else if (pct >= 60) { emoji = "💪"; msg = ui.m60; }
  else { emoji = "📖"; msg = ui.m0; }
  document.getElementById("resultsEmoji").textContent = emoji;
  document.getElementById("resultsScore").textContent = `${score} / ${TOTAL}`;
  document.getElementById("resultsMsg").textContent = msg;
}

function showResults() {
  resultsShown = true;
  renderResults();
  const res = document.getElementById("results");
  res.classList.add("show");
  setTimeout(() => res.scrollIntoView({ behavior: "smooth", block: "center" }), 200);
}

// ─── language switching: keeps answers, score and the results screen ───
function setLang(l, persist = true, first = false) {
  if (!LANGS.includes(l)) l = "pl";
  // remember which question is at the top of the screen, so the page doesn't jump
  let anchor = null, anchorTop = 0;
  if (!first) {
    for (const c of container.children) {
      const r = c.getBoundingClientRect();
      if (r.bottom > 0) { anchor = c.id; anchorTop = r.top; break; }
    }
  }
  lang = l;
  const ui = T();
  document.documentElement.lang = l;
  document.title = ui.title;
  document.getElementById("tBadge").textContent = ui.badge;
  document.getElementById("tTitle").textContent = ui.h1;
  document.getElementById("tSub").textContent = ui.sub;
  document.getElementById("tResultsLabel").textContent = ui.resultsLabel;
  document.getElementById("tRestart").textContent = ui.restart;
  document.querySelectorAll(".lang-btn").forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  if (persist) { try { localStorage.setItem("quizLang", l); } catch (e) { /* storage unavailable */ } }

  renderQuiz(first);
  if (resultsShown) renderResults();
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - anchorTop);
  }
}

document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

let startLang = "pl";
try { const saved = localStorage.getItem("quizLang"); if (LANGS.includes(saved)) startLang = saved; } catch (e) { /* storage unavailable */ }
setLang(startLang, false, true);
</script>
